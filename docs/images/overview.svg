<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">
  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a8794"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a9bd7"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8e5bd9"/></marker>
  </defs>

  <rect x="1" y="1" width="958" height="558" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <text x="32" y="44" font-size="22" font-weight="600" fill="#24292f">How the inverter talks today, and the two places Home Assistant can read it</text>
  <text x="32" y="70" font-size="14" fill="#57606a">Today the module sends its data to Renac's cloud, and the Renac app reads it there. Home Assistant can read the inverter in two places.</text>

  <!-- Inverter -->
  <rect x="40" y="200" width="200" height="150" rx="12" fill="#fff" stroke="#e07b39" stroke-width="2.5"/>
  <rect x="70" y="222" width="140" height="70" rx="6" fill="#fdf0e6" stroke="#e07b39" stroke-width="2"/>
  <path d="M85 262 q17 -20 34 0 t34 0 t34 0" fill="none" stroke="#e07b39" stroke-width="3" stroke-linecap="round"/>
  <rect x="80" y="232" width="18" height="8" fill="#e07b39"/><rect x="104" y="232" width="18" height="8" fill="#e07b39"/><rect x="128" y="232" width="18" height="8" fill="#e07b39"/>
  <text x="140" y="318" text-anchor="middle" font-weight="600" fill="#24292f">Renac N3-HV inverter</text>
  <text x="140" y="338" text-anchor="middle" font-size="13" fill="#57606a">PV, battery, grid, house</text>

  <!-- Module, attached to the inverter -->
  <rect x="270" y="236" width="160" height="78" rx="10" fill="#fff" stroke="#2f9e8f" stroke-width="2.5"/>
  <line x1="240" y1="275" x2="270" y2="275" stroke="#57606a" stroke-width="3"/>
  <line x1="405" y1="236" x2="405" y2="206" stroke="#2f9e8f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="405" cy="203" r="4" fill="#2f9e8f"/>
  <text x="350" y="266" text-anchor="middle" font-weight="600" fill="#24292f">WiFi module</text>
  <text x="350" y="286" text-anchor="middle" font-size="13" fill="#57606a">HF-LPT270, in the inverter</text>
  <text x="350" y="303" text-anchor="middle" font-size="13" fill="#57606a">WiFi and Bluetooth</text>

  <!-- Router -->
  <rect x="510" y="236" width="130" height="78" rx="10" fill="#fff" stroke="#9aa5b1" stroke-width="2.5"/>
  <line x1="540" y1="236" x2="530" y2="206" stroke="#9aa5b1" stroke-width="3" stroke-linecap="round"/>
  <line x1="610" y1="236" x2="620" y2="206" stroke="#9aa5b1" stroke-width="3" stroke-linecap="round"/>
  <text x="575" y="268" text-anchor="middle" font-weight="600" fill="#24292f">Your router</text>
  <text x="575" y="288" text-anchor="middle" font-size="13" fill="#57606a">home network</text>
  <text x="575" y="304" text-anchor="middle" font-size="13" fill="#57606a">and the internet</text>

  <!-- Cloud -->
  <path d="M760 150 a40 40 0 0 1 60 -36 a46 46 0 0 1 86 10 a34 34 0 0 1 10 66 h-150 a30 30 0 0 1 -6 -40z" fill="#fff" stroke="#6f7f99" stroke-width="2.5"/>
  <text x="838" y="156" text-anchor="middle" font-weight="600" fill="#24292f">Renac's cloud</text>
  <text x="838" y="176" text-anchor="middle" font-size="13" fill="#57606a">germany.le-pv.com:20145</text>

  <!-- Phone -->
  <rect x="800" y="236" width="76" height="130" rx="12" fill="#fff" stroke="#6f7f99" stroke-width="2.5"/>
  <rect x="810" y="252" width="56" height="88" rx="4" fill="#eef1f5"/>
  <circle cx="838" cy="354" r="5" fill="#6f7f99"/>
  <text x="838" y="392" text-anchor="middle" font-weight="600" fill="#24292f">Renac app</text>
  <text x="838" y="410" text-anchor="middle" font-size="13" fill="#57606a">reads the cloud</text>

  <!-- Home Assistant -->
  <rect x="510" y="400" width="190" height="120" rx="12" fill="#fff" stroke="#1a9bd7" stroke-width="2.5"/>
  <path d="M605 418 l44 40 h-12 v30 h-64 v-30 h-12z" fill="#e3f4fc" stroke="#1a9bd7" stroke-width="2" stroke-linejoin="round"/>
  <rect x="597" y="468" width="16" height="20" fill="#1a9bd7"/>
  <text x="605" y="508" text-anchor="middle" font-weight="600" fill="#24292f">Home Assistant</text>

  <!-- Relay -->
  <rect x="240" y="410" width="190" height="110" rx="12" fill="#fff" stroke="#8e5bd9" stroke-width="2.5"/>
  <rect x="262" y="430" width="60" height="36" rx="4" fill="#f1ebfb" stroke="#8e5bd9" stroke-width="2"/>
  <path d="M7 7 L17 17 L12 22 V2 L17 7 L7 17" fill="none" stroke="#8e5bd9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" transform="translate(280 436)"/>
  <text x="376" y="446" text-anchor="middle" font-weight="600" fill="#24292f">w2b relay</text>
  <text x="376" y="464" text-anchor="middle" font-size="13" fill="#57606a">ESP32 board</text>
  <text x="335" y="490" text-anchor="middle" font-size="13" fill="#57606a">WiFi to Bluetooth,</text>
  <text x="335" y="507" text-anchor="middle" font-size="13" fill="#57606a">placed near the inverter</text>

  <!-- Today's path: module -> router -> cloud, app -->
  <!-- A head is 15 px long with the line ending 7/10 into it, so its tip is 4.5 px past the line's end: every line
       ends 4.5 px before the border it points at. -->
  <line x1="430" y1="262" x2="505.5" y2="262" stroke="#7a8794" stroke-width="3" marker-end="url(#grey)"/>
  <text x="469" y="250" text-anchor="middle" font-size="13" fill="#57606a">WiFi</text>
  <path d="M640 262 q60 0 90 -60 q8 -20 21 -25" fill="none" stroke="#7a8794" stroke-width="3" marker-end="url(#grey)"/>
  <text x="662" y="150" font-size="13" fill="#57606a">internet</text>
  <line x1="838" y1="194.5" x2="838" y2="231.5" stroke="#7a8794" stroke-width="3" marker-start="url(#grey)" marker-end="url(#grey)"/>
  <!-- The cloud relay passes the cloud's traffic on -->
  <path d="M634 400 C 630 320 690 250 768 194" fill="none" stroke="#1a9bd7" stroke-width="3" marker-end="url(#blue)"/>
  <text x="716" y="300" font-size="13" fill="#1a9bd7" text-anchor="middle" transform="rotate(-48 716 300)">passed on to the cloud</text>

  <!-- Place 1: cloud relay -->
  <path d="M350 314 q0 46 50 56 h100 q36 0 40 25.5" fill="none" stroke="#1a9bd7" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/>
  <circle cx="440" cy="352" r="14" fill="#1a9bd7"/>
  <text x="440" y="357" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="720" y="440" font-weight="600" fill="#1a9bd7">1 Cloud relay</text>
  <text x="720" y="460" font-size="13" fill="#57606a">The module sends its data to</text>
  <text x="720" y="478" font-size="13" fill="#57606a">Home Assistant instead, which</text>
  <text x="720" y="496" font-size="13" fill="#57606a">reads it and passes it on to</text>
  <text x="720" y="514" font-size="13" fill="#57606a">Renac's cloud. The app still works.</text>

  <!-- Place 2: TCP polling -->
  <path d="M510 470 h-75.5" fill="none" stroke="#8e5bd9" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#purple)"/>
  <circle cx="470" cy="446" r="14" fill="#8e5bd9"/>
  <text x="470" y="451" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <path d="M300 410 q0 -40 26 -66 q10 -12 12 -26" fill="none" stroke="#8e5bd9" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#purple)"/>
  <text x="244" y="372" font-size="13" fill="#8e5bd9">Bluetooth</text>
  <text x="40" y="440" font-weight="600" fill="#8e5bd9">2 TCP polling</text>
  <text x="40" y="460" font-size="13" fill="#57606a">Home Assistant asks the relay,</text>
  <text x="40" y="478" font-size="13" fill="#57606a">the relay asks the module over</text>
  <text x="40" y="496" font-size="13" fill="#57606a">Bluetooth. The module keeps</text>
  <text x="40" y="514" font-size="13" fill="#57606a">talking to the cloud as before.</text>
</svg>
