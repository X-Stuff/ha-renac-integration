# Home Assistant's hassfest: the manifest, the strings and translations, the config flow, checked on every push and
# pull request, and once a week against the current Home Assistant. The tests run locally (docs/DEVELOPING.md).
name: Hassfest
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
